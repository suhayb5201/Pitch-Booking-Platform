<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحتي الأولى</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: #2c3e50;
    }
    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <h1>مرحباً بك في موقعي</h1>
  <p>هذه أول صفحة لي على GitHub.</p>
  <button onclick="sayHello()">اضغط هنا</button>
  <p id="message"></p>

  <script>
    function sayHello() {
      document.getElementById("message").innerText = "أهلاً! اشتغل الزر بنجاح 🎉";
    }
  </script>
</body>
</html>
